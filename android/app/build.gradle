plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('appversion.properties')
    //App版本配置加载
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }
    //加载签名配置文件
    def signPropertiesFile = rootProject.file('sign/key.properties')
    if (signPropertiesFile.exists()) {
        signPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }

    namespace = "com.cbq.callocollege"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    // 启用 core desugaring
    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'  // 使用最新版本
        implementation 'com.eclipsesource.j2v8:j2v8:6.2.0@aar' //j2v8引擎
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.cbq.callocollege"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        multiDexEnabled true
        versionCode = localProperties.getProperty('flutter.versionCode').toInteger()
        versionName = localProperties.getProperty('flutter.versionName')
    }

    signingConfigs {
        release {
            storeFile file(localProperties.getProperty('storeFile'))
            storePassword localProperties.getProperty('storePassword')
            keyAlias localProperties.getProperty('keyAlias')
            keyPassword localProperties.getProperty('keyPassword')
        }
    }
    buildTypes {
        debug {
            //如果模拟器不能正常运行那么接触这段注释
//            ndk {
//                // The line below only builds arm64-v8a
//                abiFilters  'arm64-v8a','x86_64' // This breaks running the app in the emulator
//            }
            signingConfig signingConfigs.release
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
//            signingConfig = signingConfigs.debug
//            signingConfigs signingConfigs.release
            debuggable false
            signingConfig signingConfigs.release // 关联 signingConfigs

            minifyEnabled false //禁用混淆
            shrinkResources false
        }
    }
    // 保留或调整 splits 配置（用于 ABI 拆分）
    splits {
        // 基于不同的abi架构配置不同的apk
        abi {
            // 必须为true，打包才会为不同的abi生成不同的apk
            enable true
            // 默认情况下，包含了所有的ABI。
            // 所以使用reset()清空所有的ABI，再使用include指定我们想要生成的架构armeabi-v7a、arm-v8a
            reset()
            // 逗号分隔列表的形式指定 Gradle 应针对哪些 ABI 生成 APK。只与 reset() 结合使用，以指定确切的 ABI 列表。
            include "armeabi-v7a", "arm64-v8a"
            // 是否生成通用的apk，也就是包含所有ABI的apk。如果设为 true，那么除了按 ABI 生成的 APK 之外，Gradle 还会生成一个通用 APK。
            universalApk false
        }
    }
}

dependencies {
    // For AGP 7.4+
//    classpath 'com.android.tools:desugar_jdk_libs:1.2.0'  // 添加 desugar_jdk_libs 库
//    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.3")
    // For AGP 7.3
    // coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.2.3")
    // For AGP 4.0 to 7.2
    // coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.1.9")
}
flutter {
    source = "../.."
}
